name: Daily Stock Screen

on:
  schedule:
    # GitHub 免費排程常延遲數小時（舊版 17:00 實際多在 23:00～01:00 才跑）→ 一天排三班，
    # 避開整點（整點最塞）。第一個「當日三大法人已入庫 ≥90%」的 run 發通知，之後的只更新資料
    # （run_daily 用 kv_meta.last_notified_trade_date 去重）；21:07 那班法人未齊也照發並註明。
    # 台灣時間 16:37 / 18:07 / 21:07 = UTC 08:37 / 10:07 / 13:07；1-5 = 週一到週五
    - cron: "37 8 * * 1-5"
    - cron: "7 10 * * 1-5"
    - cron: "7 13 * * 1-5"
  workflow_dispatch:  # 允許手動觸發
    inputs:
      force_notify:
        description: "今天已發過也強制再發一次通知"
        type: boolean
        default: false

# 同時只允許 1 個 run（包含 schedule + manual + auto-retry）：
# 新 run 進來時若已有在跑，會 queue 等待而非並行，避免同時寫同一份 DB。
# cancel-in-progress: false → 已在跑的不被砍掉，新的 queue 等
concurrency:
  group: daily-stock-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write  # checkout + release download + release upload (DB snapshot)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 從 GitHub Actions cache 還原 SQLite DB（避免每次重新下載全量資料）
      - name: Restore DB cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: data/cache.db
          key: stock-db-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            stock-db-${{ runner.os }}-bootstrap-
            stock-db-${{ runner.os }}-

      # cache miss 時從最新 release 下載（本地 bootstrap 後上傳的 DB）
      - name: Download DB from release (fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          # 用 API 查最新 release 的 asset URL（比 gh release download 更可靠）
          ASSET_URL=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/pamsinna/stockstw/releases/latest" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          for a in assets:
              if a['name'] == 'cache.db.gz':
                  print(a['url'])
                  break
          " 2>/dev/null || true)

          if [ -n "$ASSET_URL" ]; then
            echo "Downloading cache.db.gz from release..."
            curl -Lf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" -o data/cache.db.gz \
              && gzip -d data/cache.db.gz \
              && echo "DB downloaded and decompressed from release ($(du -sh data/cache.db | cut -f1))" \
              || echo "Download failed, starting with empty DB"
          else
            echo "No release asset found, starting with empty DB"
          fi

      - name: Create reports dir
        run: mkdir -p reports

      - name: Run daily screen
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_NOTIFY:        ${{ inputs.force_notify && '1' || '0' }}
        run: python main.py screen

      # 更新後的 DB 存回 cache，下次跑只需補 1 天資料
      - name: Save updated DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache.db
          key: stock-db-${{ runner.os }}-${{ github.run_number }}

      # 上傳今日報告為 artifact（保留 7 天）
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: reports/signals_*.csv
          retention-days: 7

      # 上傳更新後的 DB 到 GitHub Release（給本地同步用）
      # 使用固定 tag `db-daily-latest`，每次 force-update 覆蓋
      - name: Upload DB snapshot to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 防止 SQLite 寫到一半被 tar 讀到（保險措施）
          pkill -f "python main.py" 2>/dev/null || true
          sleep 3

          # 壓縮 DB（先清舊檔避免 gzip 拒絕覆蓋）
          rm -f data/cache.db.gz
          echo "Compressing cache.db ($(du -sh data/cache.db | cut -f1))..."
          gzip -k -9 -f data/cache.db
          echo "Compressed: $(du -sh data/cache.db.gz | cut -f1)"

          TAG="db-daily-latest"
          DATE=$(date -u +"%Y-%m-%d")
          TITLE="Daily DB snapshot ${DATE}"
          NOTES="Auto-updated by daily_screen.yml on ${DATE} UTC.

          Restore locally:
              gh release download ${TAG} --repo pamsinna/stockstw --pattern 'cache.db.gz' --output data/cache.db.gz --clobber
              gzip -d -f data/cache.db.gz"

          # 砍掉舊 release（若存在）+ 重新建立（GitHub 不支援 release file replace）
          gh release delete "$TAG" --repo pamsinna/stockstw --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" data/cache.db.gz \
            --repo pamsinna/stockstw \
            --title "$TITLE" \
            --notes "$NOTES"

          echo "DB snapshot uploaded to release tag: $TAG"

      # 系統 audit：找出資料缺漏 / 9999 殘留 / 衍生資料源 stale 等
      # 「資料沒讀到 → 訊號沒發」的隱形失敗點。
      # 有 critical 或 warning 時自動推 Telegram 摘要。
      - name: System audit (post-screen)
        if: always()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 印詳細報告到 log（exit code 1 也讓 workflow 繼續）
          python scripts/system_audit.py || true
          # 推 Telegram 摘要（無 finding 時不發）
          python scripts/system_audit.py --telegram || true
